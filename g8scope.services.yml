services:
  # The g8scope reporter, built from $settings['g8scope'] in settings.php.
  g8scope.reporter:
    class: G8Scope\Drupal\Reporter
    factory: ['G8Scope\Drupal\ReporterFactory', 'fromDrupalSettings']
    arguments: ['@settings']

  # Subscribes to KernelEvents::EXCEPTION and forwards Throwables to the reporter.
  g8scope.exception_subscriber:
    class: Drupal\g8scope\EventSubscriber\ExceptionSubscriber
    arguments: ['@g8scope.reporter']
    tags:
      - { name: event_subscriber }
